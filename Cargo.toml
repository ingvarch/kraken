[package]
name = "kraken-release"
version = "0.3.0"
edition = "2024"
description = "Bump the version, tag the release and push it"
license = "MIT"
repository = "https://github.com/ingvarch/kraken"
rust-version = "1.88"
keywords = ["release", "version", "semver", "git", "changelog"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
jsonc-parser = { version = "0.34.0", features = ["cst"] }
md5 = "0.8"
quick-xml = "0.42.0"
ratatui = "0.30.2"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml_edit = "0.25.17"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"

[lib]
name = "kraken"

[[bin]]
name = "kraken"
path = "src/main.rs"

[package.metadata.binstall]
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/kraken_{ version }_linux_amd64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/kraken_{ version }_linux_arm64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/kraken_{ version }_darwin_amd64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/kraken_{ version }_darwin_arm64.tar.gz"
