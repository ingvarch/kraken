# Licenses kraken may link. cargo-about fails on any other, and picks the first
# match from this list when a crate offers a choice.
accepted = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]

# The release targets in .goreleaser.yaml.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

ignore-dev-dependencies = true
ignore-build-dependencies = true
