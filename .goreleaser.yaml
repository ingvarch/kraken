# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: kraken

# The licenses of what kraken links ask for their texts in every copy. This also
# fails on a license about.toml does not accept.
# The completion scripts come from a host build of this commit and are the same
# for every target. The zsh file is _kraken because zsh finds it by name.
before:
  hooks:
    - cargo about generate --fail --output-file THIRD_PARTY_NOTICES about.hbs
    - mkdir -p completions
    - sh -c "cargo run --locked --quiet -- completions bash > completions/kraken.bash"
    - sh -c "cargo run --locked --quiet -- completions zsh > completions/_kraken"
    - sh -c "cargo run --locked --quiet -- completions fish > completions/kraken.fish"

builds:
  - id: kraken
    builder: rust
    binary: kraken
    flags:
      - --release
      - --locked
    # kraken runs git in its own process group and stops it with kill, so it
    # builds for Unix only.
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
      - x86_64-apple-darwin
      - aarch64-apple-darwin

# Gatekeeper runs a downloaded binary only once Apple has notarized it. A
# snapshot has no Apple keys, a release fails without them.
notarize:
  macos:
    - enabled: "{{ not .IsSnapshot }}"
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES
      # The README links to these guides.
      - docs/*.md
      - completions/*

changelog:
  use: github-native

homebrew_casks:
  - homepage: https://github.com/ingvarch/kraken
    description: Bump the version, tag the release and push it
    license: MIT
    skip_upload: auto
    completions:
      bash: completions/kraken.bash
      zsh: completions/_kraken
      fish: completions/kraken.fish
    repository:
      owner: ingvarch
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
